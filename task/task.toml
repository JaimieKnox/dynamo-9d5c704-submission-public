[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose residency index, lag padding, and registration order disagree under ring wrap"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and insert-step epoch attachment, current pre-draw importance weights, and
deferred in-batch write-back are already contract-faithful. Graded ledgers still diverge because
segment residency follows the latest admission index rather than the earliest, lagged sampler
vectors pad newly registered rows with 1.0 rather than current priorities, and same-step
registration sorts by earliest-then-latest instead of latest-then-earliest. Sample bundles set
both delays to zero, keep a large ring, and use batch size one, so those interactions stay green
there.

The recordings are synthetic fixtures built to force wrap-time residency, lag extension during
registration bursts, and same-step seed order to interact across modules. An RL infrastructure
engineer would perform this reconstruction when validating reproducibility of an asynchronous
learner under publication lag and priority aging.

Solving requires tracing residency through the segment helper, lag extension in the learner, and
registration ordering against live seed maxima as one state machine. Local patches that only
restore insert-step epochs or deferred write-backs no longer reach the graded ledger.
"""
solution_explanation = """
Keep insert-step epoch attachment, current pre-draw importance weights, and deferred write-back.
Make segment residency follow the earliest admission index. When extending a lagged sampler
vector, append current pre-draw priorities for new trailing rows. Sort same-step registrations by
ascending (latest, earliest) admission index. Install the fixed ingest, buffer, segments, and
learner modules, then run the CLI.
"""
verification_explanation = """
The verifier recomputes ledgers from sealed inputs with a reference package that follows the
contract. Counts match exactly and floating aggregates match at six decimals. The oracle copies
the four fixed modules and runs the CLI. A nop agent keeps latest-index residency, unit lag
padding, and earliest-first registration order, so graded bundles diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

