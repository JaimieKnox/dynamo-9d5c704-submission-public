[task]
name = "dynamo/timeout-cut-returns"
description = "Repair timeout-cut lambda returns under same-index timeout residency, eligibility cuts, and powered IS mass"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 8
difficulty_explanation = """
Graded artifacts diverge when lagged asymmetric critics, mid-segment timeout residency on
the same-index bootstrap critic, reverse-time eligibility cuts at timeouts, segment reward
scales with accumulator resets, and power-then-clip-renormalize IS mass interact. Specs are
split under /app/spec, so matching only one file still leaves packs wrong. Fixtures are
synthetic packs generated for this task, not production logs. An RL training engineer hits
this when validating advantage pipelines under environment timeouts and offline importance
weights.
"""
solution_explanation = """
Restore lagged dual-stream registration so critic_a/lag_a/init_a builds V_t and
critic_b/lag_b/init_b builds the bootstrap stream. In successor resolution, zero only on
terminated rows; mid-segment pure truncation bootstraps from registered critic_b at the
same index t, while final/segment-edge truncation and non-truncated edges use
meta.bootstrap_value. In the reverse-time core, reset the lambda accumulator on segment
changes, scale rewards by segment_scales, and set eligibility to zero on truncated rows
while still using the timeout bootstrap inside the TD residual. In the ledger, average
non-terminated mass after raising is_weight to is_power, clipping, and renormalizing, and
set bootstrapped only for truncated non-terminated indices. Install solution/fixed modules
and run the CLI.
"""
verification_explanation = """
The verifier seals oracle reports into tests/inputs/sealed_expectations.json, then
compares each produced /app/artifacts/<trace>.json against that sealed baseline.
Per-index advantage and return, plus summary mean_advantage and mean_return, use
pytest.approx(..., abs=1e-6). That absolute band matches the instruction contract of
six-decimal equality after both sides round with the shared _round6 helper, so
floating noise below the last graded digit cannot flip the reward while a wrong
seam freeze, lag invalidation, or mass exclusion still fails.
Schema, bootstrapped flags, and summary counts are exact.
"""

