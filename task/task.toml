[task]
name = "dynamo/timeout-cut-returns"
description = "Repair near-correct lambda-return ledger whose asymmetric critics, segment scales, and clip-renorm IS mass disagree under mixed cuts"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 8
difficulty_explanation = """
Graded artifacts diverge when asymmetric lagged critics, segment reward scales, segment-edge bootstraps, reverse-time resets, and clip-then-renormalize IS mass interact. Specs are split under /app/spec, so matching only the short contract still leaves packs wrong. Fixtures are synthetic packs generated for this task, not production logs. An RL training engineer hits this when validating advantage pipelines under environment timeouts and offline importance weights.
"""
solution_explanation = """
The installed cutreturn tree is near-correct but diverges from /app/spec on interacting edges.
Restore lagged dual-stream registration in register.py: critic_a uses lag_a/init_a for V_t and
critic_b uses lag_b/init_b for the bootstrap stream (the buggy tree ignores lag fill and reuses
critic_a for both). In successor.py, zero successors only on terminated rows; pure truncation,
final-horizon steps, and segment edges must bootstrap with meta.bootstrap_value and nonterminal
one (the buggy tree also zeros truncated rows and drops final/segment-edge bootstrap). In gae.py,
clear the reverse-time lambda accumulator on segment changes and scale rewards by
segment_scales[segment[t]] before the TD residual. In ledger.py, build summary mass over
non-terminated indices (full-horizon fallback if every index terminated), clip is_weight into
[is_clip_low, is_clip_high], renormalize clipped weights, and set bootstrapped only when
truncated and not terminated. Copy the fixed modules from solution/fixed into /app/cutreturn and
run the CLI over /app/traces into /app/artifacts.
"""
verification_explanation = """
The verifier seals oracle reports into tests/inputs/sealed_expectations.json, then
compares each produced /app/artifacts/<trace>.json against that sealed baseline.
Per-index advantage and return, plus summary mean_advantage and mean_return, use
pytest.approx(..., abs=1e-6). That absolute band matches the instruction contract of
six-decimal equality after both sides round with the shared _round6 helper, so
floating noise below the last graded digit cannot flip the reward while a wrong
asymmetric successor, lag, or clipped-mass patch still fails.
Schema, bootstrapped flags, and summary counts are exact.
"""

[verifier]
timeout_sec = 900.0

