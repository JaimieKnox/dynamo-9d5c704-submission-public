difficulty_explanation = """
Graded packs diverge when open-freeze successors, truncation residency, scale_lag pads,
eligibility cuts, powered mass, and empty-mass fallback interact on one horizon. Specs
state invariants rather than a numbered patch recipe, so a single-pass transcription of
one file still leaves packs wrong. Fixtures are synthetic packs generated for this task,
not production logs. An RL training engineer hits this when validating advantage
pipelines under environment timeouts and offline importance weights.
"""
solution_explanation = """
Graded artifacts still disagree with /app/spec on mixed cut packs: summary means shift
when membership collapses, and per-index advantages drift when residency, scale pads, and
open freezes co-occur. Align cutreturn to every normative file under /app/spec, install
the repaired modules, and run the CLI over /app/traces into /app/artifacts.
"""
verification_explanation = """
The verifier seals oracle reports into tests/inputs/sealed_expectations.json, then
compares each produced /app/artifacts/<trace>.json against that sealed baseline.
Per-index advantage and return, plus summary means, use pytest.approx(..., abs=1e-6).
Schema, bootstrapped flags, and summary counts are exact.
"""

