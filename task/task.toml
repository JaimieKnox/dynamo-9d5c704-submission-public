[task]
name = "dynamo/timeout-cut-returns"
description = "Repair near-correct λ-return ledger whose lagged critics, segment-edge bootstraps, and clipped IS mass disagree under mixed episode cuts"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 8
difficulty_explanation = """
Graded artifacts diverge when lagged critic registration, segment-edge bootstrap
successors, reverse-time segment resets, and clipped IS-weighted summary mass interact on
shared horizons. Specs are split across multiple files under /app/spec, so a patch that only
matches the main contract still leaves packs wrong. Fixtures are synthetic packs generated
for this task, not production logs. An RL training engineer hits this when validating
advantage pipelines under environment timeouts and offline importance weights.
"""
solution_explanation = """
Apply meta value_lag in a registration helper, resolve successors with segment-edge
bootstrap_value, reset the lambda accumulator across segment changes, prefer termination on
dual-flag rows, and compute summary means with clipped IS weights over non-terminated indices
plus a full-horizon fallback. Install the fixed modules and run the CLI.
"""
verification_explanation = """
The verifier seals oracle reports into tests/inputs/sealed_expectations.json, then
compares each produced /app/artifacts/<trace>.json against that sealed baseline.
Per-index advantage and return, plus summary mean_advantage and mean_return, use
pytest.approx(..., abs=1e-6). That absolute band matches the instruction contract of
six-decimal equality after both sides round with the shared _round6 helper, so
floating noise below the last graded digit cannot flip the reward while a wrong
lag, segment-edge bootstrap, or clipped-mass patch still fails.
Schema, bootstrapped flags, and summary counts are exact.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

