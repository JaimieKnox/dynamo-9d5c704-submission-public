[task]
name = "dynamo/timeout-cut-returns"
description = "Repair near-correct λ-return ledger whose cut masks, final-horizon bootstrap, dual-flag precedence, and summary mass disagree under mixed episode cuts"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 8
difficulty_explanation = """
The ledger already walks a reverse-time λ-return recurrence and writes per-step
advantages. Graded reports still diverge when cut masks must keep bootstrap values for
timeout cuts (including the final index, which has no stored successor value), when
dual-flag rows must prefer termination over truncation, and when summary means must drop
only terminated indices with an all-terminated fallback. The no-cut sample pack stays green
while single-cut, dual-flag, final-truncation, and all-terminated packs still diverge.
Synthetic fixtures place those cuts on shared horizons so a patch that only edits the GAE
loop or only edits mean mass still leaves graded artifacts wrong. An RL training engineer
hits this when validating advantage pipelines under environment timeouts.
"""
solution_explanation = """
Build next-value and non-terminal masks in a dedicated cut-mask module: termination
zeros both; timeout cuts bootstrap from the next stored value or from meta bootstrap_value
at the final index; dual-flag rows follow termination. Run the λ-return recurrence on those
masks. Average summary means over non-terminated indices only, with a full-horizon fallback
when every index is terminated. Mark bootstrapped only when truncated and not terminated.
Install the fixed modules and run the CLI.
"""
verification_explanation = """
The verifier seals oracle reports into tests/inputs/sealed_expectations.json, then
compares each produced /app/artifacts/<trace>.json against that sealed baseline.
Per-index advantage and return, plus summary mean_advantage and mean_return, use
pytest.approx(..., abs=1e-6). That absolute band matches the instruction contract of
six-decimal equality after both sides round with the shared _round6 helper, so
floating noise below the last graded digit cannot flip the reward while a wrong
cut-mask, final-horizon bootstrap, dual-flag, or mean-mass patch still fails.
Schema, bootstrapped flags, and summary counts are exact.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

