[task]
name = "dynamo/timeout-cut-returns"
description = "Repair near-correct λ-return ledger whose truncation bootstrap and summary mass disagree under mixed episode cuts"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 8
difficulty_explanation = """
The ledger already walks a reverse-time GAE recurrence and writes per-step advantages.
Graded reports still diverge when timeout truncations must bootstrap from the pack value
while true terminations must zero the next value, and when summary means must drop only
terminated indices. The no-cut sample pack stays green while single-cut and mixed-cut packs still diverge. Synthetic fixtures place
truncations and terminations on shared horizons so an independent one-line patch that
fixes only bootstrap or only mean mass still leaves graded means wrong. An RL training
engineer hits this when validating advantage pipelines under environment timeouts.
"""
solution_explanation = """
Bootstrap truncated indices from the next value (including meta bootstrap_value at the
final cut) while keeping non-terminal=1; zero both next value and non-terminal on true
terminations; average summary means over non-terminated indices only. Install fixed
modules and run the CLI.
"""
verification_explanation = """
The verifier seals oracle reports into tests/inputs/sealed_expectations.json, then
compares each produced /app/artifacts/<trace>.json against that sealed baseline.
Per-index advantage and return, plus summary mean_advantage and mean_return, use
pytest.approx(..., abs=1e-6). That absolute band matches the instruction contract of
six-decimal equality after both sides round with the shared _round6 helper, so
floating noise below the last graded digit cannot flip the reward while a wrong
bootstrap or mean-mass patch still fails.
Schema, bootstrapped flags, and summary counts are exact.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
