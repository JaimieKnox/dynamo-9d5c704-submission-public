[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose batch snapshots, attached scoring epochs, and window formation silently disagree under composition"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and several previously failing helpers are already contract-faithful. The graded
failures come from composition: priority rewrites become visible inside the same multi-draw batch,
attached scoring epochs on resident segments are retargeted when the reported target epoch moves,
and window segments are illegally formed when a scan stops on an episode's final transition.
Sample bundles use batch size one and a single scoring epoch, and their episode endings avoid the
illegal window shape, so those interactions stay green there.

An agent that only patches lagged ingest watermarks or resident-only N no longer reaches the
graded ledger. Solving requires tracing snapshot isolation across repeated draws, the difference
between reported target_epoch and attached scoring epochs, and segment-formation boundaries
together as one long-horizon state machine.
"""
solution_explanation = """
Keep faithful ingest visibility and full-registry IS weight scope. Form no window segment that
stops on an episode's last transition. Attach the registration-time target epoch to each segment
and never rewrite that attachment when later steps report a new target_epoch. Snapshot N, P, and
priorities before the batch, resolve every draw against that snapshot, and commit accepted
priority rewrites only after the batch finishes, with the last acceptance winning for repeats.
Install the fixed ingest, segments, and learner modules, then run the CLI.
"""
verification_explanation = """
The verifier recomputes ledgers from sealed inputs with a reference package that follows the
contract. Counts match exactly and floating aggregates match at six decimals. The oracle copies
the three fixed modules and runs the CLI. A nop agent keeps in-batch priority visibility, epoch
retargeting, and illegal end windows, so graded bundles diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
