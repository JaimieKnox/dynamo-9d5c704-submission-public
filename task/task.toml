[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose completing-transition residency, completion-epoch attach, and resident-only IS mass disagree"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and several previously failing helpers are already contract-faithful. Graded
ledgers still diverge because segment residency follows the completing transition's admission
index, the scoring epoch is the epoch from the completion step even when insert is delayed, and
importance weights use resident-only length and mass. Sample bundles set delays to zero and keep a
large ring so those interactions stay green there.

The recordings are synthetic fixtures built to force wrap-time completing-transition residency,
completion-versus-insert epoch crossings, and resident-only weight mass to interact. An RL
infrastructure engineer would perform this reconstruction when validating reproducibility of an
asynchronous learner under publication lag and priority aging.

Solving requires re-deriving residency, epoch attachment, and IS mass from the contract rather
than replaying an earlier patch list. Local patches that only restore truncation boots or inclusive
ring inequalities no longer reach the graded ledger.
"""
solution_explanation = """
Make segment residency follow the completing transition's admission index. Attach the completion-
step target epoch when the segment becomes complete, even if ledger insert waits for
register_delay. Compute importance weights from resident-only length and mass. Keep faithful
visibility lag, truncation cut observation, deferred write-back, and lagged sampler draws. Install
the fixed ingest, buffer, segments, and learner modules, then run the CLI.
"""
verification_explanation = """
The verifier recomputes ledgers from sealed inputs with a reference package that follows the
contract. Counts match exactly and floating aggregates match at six decimals. The oracle copies
the four fixed modules and runs the CLI. A nop agent keeps first-transition residency, insert-step
epoch attachment, and full-ledger IS mass, so graded bundles diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
