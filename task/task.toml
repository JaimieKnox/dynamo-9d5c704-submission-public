[task]
name = "dynamo/audit-replay-learner"
description = "Correct phase-boundary behavior in an executable replay learner that emits inaccurate audit ledgers"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 8
difficulty_explanation = """
Nothing is absent and ordinary execution succeeds. The three sample recordings also remain
green because each has one publication path and avoids the rejected-draw normalization trap.
Graded cases instead combine unordered, overlapping publication facts with constrained rings
and mixed accepted/rejected batches. The learner must compose a cumulative watermark reduction
with the accepted-only importance-weight pool; treating file order as chronology or attempted
draws as normalization samples silently changes later state and aggregates.

The supplied recordings are synthetic fixtures generated to isolate these boundary cases.
An RL-infrastructure engineer would perform this reconstruction when validating reproducibility
or diagnosing silent learner drift in an asynchronous training pipeline.

Solving the task requires reconciling the main contract with the exact reductions in its
normative comparisons appendix, then tracing admission, registration, residency, sampling,
V-trace scoring, accepted-only normalization and deferred write-back as one transaction. The
work is both implementation and debugging: helpers and most of the loop are already correct,
sample ledgers stay green, and no expected output is shipped.
"""
solution_explanation = """
Reduce all in-force ingest entries to their greatest watermark without using JSON order.
During each batch, compute raw importance weights only for resident accepted draws and use
that accepted multiset for both `w_max` and the normalized mean. Preserve the already-correct
earliest-index residency, pre-draw priority snapshot, deferred write-back, and epoch floor
division behavior.
"""
verification_explanation = """
The verifier recomputes every ledger from verifier-owned bundle inputs with a reference package
built from the same contract-correct helpers and the corrected learner. Structural fields and
counts match exactly; floating aggregates match at six-decimal precision. The oracle copies
the corrected ingest and learner modules and runs the normal CLI, while a nop agent retains
the plausible order-sensitive visibility and attempted-weight normalization and diverges on
every graded bundle.
"""
[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

