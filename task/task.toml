[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose visibility lag, carried scoring epochs, and ledger-length IS weights disagree"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and earliest-index residency, lagged sampler extension, and latest-first
registration order are already contract-faithful. Graded ledgers still diverge because ingest
ignores visibility_lag when deciding effective publication, accepted draws are scored under the
live step target epoch rather than the epoch carried at ledger insert, and importance weights
replace ledger length N with a resident-only count. Sample bundles set visibility_lag to zero,
keep target_refresh_interval beyond the run, and use a large ring, so those interactions stay
green there.

The recordings are synthetic fixtures built to force lagged publication, carried-versus-live
epochs, and eviction-time weight mass to interact across modules. An RL infrastructure engineer
would perform this reconstruction when validating reproducibility of an asynchronous learner
under publication lag and priority aging.

Solving requires tracing ingest effectiveness, carried scoring epochs across refresh boundaries,
and ledger-length N under wrap as one state machine. Local patches that only restore residency
index or registration sort order no longer reach the graded ledger.
"""
solution_explanation = """
Keep earliest-index residency, current-priority lag padding, and latest-first registration.
Honor visibility_lag inside ingest watermark selection. Score accepted draws under the epoch
carried by the ledger entry. Compute importance weights with ledger length N over every
registered row. Install the fixed ingest, buffer, segments, and learner modules, then run the CLI.
"""
verification_explanation = """
The verifier recomputes ledgers from sealed inputs with a reference package that follows the
contract. Counts match exactly and floating aggregates match at six decimals. The oracle copies
the four fixed modules and runs the CLI. A nop agent ignores visibility_lag, scores under the live
step epoch, and uses resident-only N, so graded bundles diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

