[task]
name = "dynamo/audit-replay-learner"
description = "Correct phase-boundary behavior in an executable replay learner that emits inaccurate audit ledgers"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 8
difficulty_explanation = """
Nothing is absent and ordinary execution succeeds, so the challenge is recognizing two
incorrect phase boundaries in a plausible learner loop. The three sample recordings do not
expose them. Graded cases bring constrained ring capacity, target refreshes, and multi-draw
batches together early: residency depends on the earliest transition covered, while priority
writes cannot affect unresolved draws from the same step. Violating either invariant silently
changes subsequent selections and importance weights.

The supplied recordings are synthetic fixtures generated to isolate these boundary cases.
An RL-infrastructure engineer would perform this reconstruction when validating reproducibility
or diagnosing silent learner drift in an asynchronous training pipeline.

Solving the task requires tracing asynchronous admission, segment registration, exact `<=`
ring residency, epoch floor division, priority-proportional sampling, V-trace scoring and
deferred write-back as one ordered transaction. The work is both implementation and debugging:
the loop already looks plausible, sample ledgers stay green, and no expected output is shipped.
"""
solution_explanation = """
Keep the complete loop but repair its phase boundaries. Settle segment residency from the
earliest transition admission index after admission, snapshot registry size and total once
before drawing, resolve the whole deterministic batch against unchanged priorities, compute
`w_raw = (N * (p / P)) ** (-beta)` from that snapshot, and defer all priority writes until
the batch is complete. Target epoch remains `step // target_refresh_interval`.
"""
verification_explanation = """
The verifier recomputes every ledger from verifier-owned bundle inputs with a reference package
built from the same contract-correct helpers and the corrected learner. Structural fields and
counts match exactly; floating aggregates match at six-decimal precision. The oracle copies
only the corrected learner and runs the normal CLI, while a nop agent retains the plausible
but phase-incorrect implementation and diverges on every graded bundle.
"""
[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

