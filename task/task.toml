[task]
name = "dynamo/offpolicy-pulse-ledger"
description = "Repair near-correct off-policy pulse ledger whose residency span, truncation bootstrap, and lagged importance mass disagree under wrap"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The pulse ledger already keeps inclusive ring and quarantine boundaries, insert-time
epoch stamping, full-ledger seeds, accepted-only importance pooling, and ascending
same-tick registration. Graded ledgers still diverge under ring wrap, sampler lag,
and truncated episode cuts: accepted slots, rejected counts, bootstrap means, and
mean importance drift together on the same learner ticks even though sample packs
with a huge ring, zero lag, zero quarantine, and no truncations stay green.

The recordings are synthetic fixtures built so wrap, lag padding, and truncated
continuation values coincide on graded ticks. An RL infrastructure engineer would
perform this reconstruction when validating asynchronous off-policy reproducibility
under publication lag and priority aging.

Solving requires composing several phase rules as one state machine across buffer,
segment, and learner modules. Independent one-field patches that ignore cross-module
interactions still leave graded ledgers divergent.
"""
solution_explanation = """
Keep inclusive ring and quarantine boundaries, insert-time epoch stamping, full-ledger
seeds, accepted-only importance pooling, and ascending registration. Make segment
residence require every covered admission index to still own its slot (not only the
latest). Bootstrap truncated segments from the recorded cut continuation observation
in both formation and bootstrap targets. Score importance weights from current
pre-draw priorities against the full-ledger mass P, with sampler lag snapshots taken
only after write-back. Install the fixed modules and run the CLI.
"""
verification_explanation = """
The verifier seals oracle ledgers in a derive phase, removes the reference tree, then
grades agent outputs against the sealed pack with no oracle import. Counts match
exactly and floating aggregates match at six decimals. The oracle copies fixed
modules and runs the CLI. A nop agent keeps the closing-edge residency anchor,
cut-transition truncation bootstrap, and lagged importance mass, so graded packs
diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
