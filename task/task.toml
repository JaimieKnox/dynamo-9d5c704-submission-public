[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose insert-time epoch attach, full-ledger IS mass, and last-wins writeback disagree under delayed registration"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and previously brittle helpers are already contract-faithful on visibility lag
sign, registration sort keys, and ordinary frozen scoring under zero delay. Graded ledgers still
diverge because scoring epochs attach at delayed insert rather than at completion, importance
weights use the full ledger priority mass including nonresident rows, and repeated accepts in one
batch keep only the last rewrite. Sample bundles set registration delay and sampler lag to zero
and keep a large ring, so those interactions stay green there.

The recordings are synthetic fixtures built so delayed insert crosses an epoch boundary, ring wrap
creates nonresident ledger mass during draws, and multi-draw batches repeat positions. An RL
infrastructure engineer would perform this reconstruction when validating asynchronous learner
reproducibility under publication lag and priority aging.

Solving requires composing completion versus insert timing, full-ledger IS mass versus residency,
and last-wins batch commit order as one state machine. Single-line lag-sign or sort-key patches no
longer reach the graded ledger.
"""
solution_explanation = """
Keep faithful visibility postponement, registration ordering, sampler lag, and deferred in-batch
priority visibility. Attach the scoring epoch on the insert step after register_delay, not on the
earlier completion step. Compute importance weights from full-ledger pre-draw priority mass.
When a ledger position is accepted more than once in a step, keep the last rewrite in draw order.
Install the fixed modules and run the CLI.
"""
verification_explanation = """
The verifier seals oracle ledgers in a derive phase, removes the reference tree, then grades agent
outputs against the sealed bundle with no oracle import. Counts match exactly and floating
aggregates match at six decimals. The oracle copies fixed modules and runs the CLI. A nop agent
keeps completion-time epoch attach, resident-only IS mass, and first-wins writeback, so graded
bundles diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
