[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose delayed registration, lagged sampler priorities, and ledger seeding disagree under long-horizon composition"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and several previously failing helpers are already contract-faithful. Graded
ledgers still diverge because registration waits a configured delay after completion, the sampler
draws from the previous step's post-writeback priorities while importance weights use the current
pre-draw snapshot, and new ledger rows seed from the full ledger maximum rather than only resident
rows. Sample bundles set both delays to zero and keep a large ring, so those interactions stay green
there.

The recordings are synthetic fixtures built to force delayed registration, stale sampler mass, and
wrap-time seeding to interact. An RL infrastructure engineer would perform this reconstruction when
validating reproducibility of an asynchronous learner under publication lag and priority aging.

Solving requires tracing completion versus insert timing, attached scoring epochs at insert,
lagged sampler vectors versus current IS weights, and ledger-wide seed maxima across wraparound as
one state machine. Local patches that only restore in-batch write-back isolation or end-window skips
no longer reach the graded ledger.
"""
solution_explanation = """
Honor register_delay between segment completion and ledger insert, attaching the insert-step epoch.
When sampler_priority_lag is positive, draw from the previous step's post-writeback priorities while
still computing importance weights from the current pre-draw snapshot. Seed inserts from the max
over every ledger priority, resident or not. Keep faithful visibility sentinels, window formation,
and deferred in-batch write-back. Install the fixed ingest, buffer, segments, and learner modules,
then run the CLI.
"""
verification_explanation = """
The verifier recomputes ledgers from sealed inputs with a reference package that follows the
contract. Counts match exactly and floating aggregates match at six decimals. The oracle copies
the four fixed modules and runs the CLI. A nop agent ignores registration delay, sampler lag, and
ledger-wide seeding, so graded bundles diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

