difficulty_explanation = """
Synthetic offline packs under /app/traces stress timeout-cut lambda returns for an RL
training engineer validating advantage pipelines. The ledger splits the TD state stream from
the emitted return baseline, couples registration init pads into eligibility and mass, and
allows per-segment lambda overrides that disagree with the pack lambda.
"""
solution_explanation = """
Graded artifacts still disagree with /app/spec on mixed cut packs: summary means shift
when open-frozen weights and pad membership diverge, and per-index advantages drift when
trunc residency and scale-pad eligibility co-occur with seam freezes. Align cutreturn to
every normative file under /app/spec, install the repaired modules, and run the CLI.
"""
verification_explanation = """
The verifier seals oracle reports into tests/inputs/sealed_expectations.json, then
compares each produced /app/artifacts/<trace>.json against that sealed baseline.
Per-index advantage and return, plus summary means, use pytest.approx(..., abs=1e-6).
Schema, bootstrapped flags, and summary counts are exact.
"""

