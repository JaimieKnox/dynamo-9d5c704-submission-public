[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose lagged visibility, frozen scoring epochs, and IS weight scope silently disagree with the contract"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 10
difficulty_explanation = """
The auditor already runs and most helpers look contract-faithful. Three interacting defects remain
silent on the sample bundles: ingest facts ignore visibility_lag, V-trace scoring uses the draw
step epoch instead of the epoch frozen at segment registration, and importance weights substitute
a resident-only N for the full registry length. Sample bundles use lag zero, a single scoring
epoch, and a large ring, so those disagreements never surface there.

Graded bundles combine deferred ingest effectiveness, early target refreshes across multiple
epoch snapshots, tight rings with multi-draw batches, and unordered publication logs. Local
patches that only restore max-watermark ingest or accepted-only weight pools are insufficient.
The agent must compose lagged visibility, registration-time epoch freeze, residency, deferred
priority write-back, and full-registry IS normalization as one long-horizon state machine.
"""
solution_explanation = """
Keep the shipped loop structure. Honor visibility_lag when reducing ingest watermarks. Freeze
the target epoch onto each segment at registration and score every later accepted draw under that
frozen snapshot while still reporting e(s) as target_epoch. Snapshot full registry N and P before
drawing, normalize IS weights over accepted draws only with that full N, and apply priority
write-backs only after the batch resolves. Replace ingest.py and learner.py with the fixed copies,
then run the CLI over /app/runs into /app/out.
"""
verification_explanation = """
The verifier recomputes every ledger from verifier-owned bundle inputs with a reference package
built from the corrected ingest and learner. Structural fields and counts match exactly. Floating
aggregates match at six-decimal precision. The oracle copies the fixed modules and runs the CLI.
A nop agent keeps lagged-visibility ignore, draw-step scoring, and resident-only N, so every
graded bundle diverges while samples stay green.
"""
[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
