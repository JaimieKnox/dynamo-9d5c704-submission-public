[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose publication lag sign, stored scoring epochs, and registration order disagree"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and inclusive ring residency, truncated cut observations, pre-draw importance
mass, and deferred write-back are already contract-faithful. Graded ledgers still diverge because
ingest applies publication lag with the wrong sign, accepted draws are scored under the live step
target epoch rather than the epoch stored at ledger insert, and same-step registration orders by
first-admitted then final-admitted index. Sample bundles set visibility_lag to zero and keep
target_refresh_interval beyond the run, so those interactions stay green there.

The recordings are synthetic fixtures built to force lagged publication timing, carried-versus-live
epochs, and concurrent registration order to interact across modules. An RL infrastructure
engineer would perform this reconstruction when validating reproducibility of an asynchronous
learner under publication lag and priority aging.

Solving requires tracing ingest eligibility, stored scoring epochs across refresh boundaries, and
same-step ledger assignment as one state machine. Local patches that only restore ring inclusivity
or truncated cut observations no longer reach the graded ledger.
"""
solution_explanation = """
Keep inclusive residency, cut_obs_id truncation boots, pre-draw IS mass, and deferred write-back.
Apply publication lag by waiting past each ingest entry's recorded step. Score accepted draws under
the epoch stored on the ledger entry. Sort same-step registrations by final-admitted then
first-admitted index. Install the fixed ingest, buffer, segments, and learner modules, then run
the CLI.
"""
verification_explanation = """
The verifier recomputes ledgers from sealed inputs with a reference package that follows the
contract. Counts match exactly and floating aggregates match at six decimals. The oracle copies
the four fixed modules and runs the CLI. A nop agent subtracts publication lag, scores under the
live step epoch, and sorts registrations first-then-final, so graded bundles diverge while samples
stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
