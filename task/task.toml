[task]
name = "dynamo/audit-replay-learner"
description = "Repair near-correct async replay learner whose truncation bootstrap, draw-phase IS mass, and mid-batch write-back disagree under lag"

[metadata]
# Pre-seeded when this repo was created. DO NOT EDIT.
category = "Model Training and ML Infrastructure"
subcategory = "Reinforcement learning"
# Fixed for this dataset. LEAVE AS-IS.
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "debug"]
artifact_type = ["codebase", "generated_output_artifact"]
expert_time_estimate_hours = 12
difficulty_explanation = """
The auditor runs and visibility lag, carried scoring epochs, and ledger-length importance weights
are already contract-faithful. Graded ledgers still diverge because truncated segments bootstrap
from the wrong observation, the ring residency boundary is off by one, and importance weights use
the sampler draw mass while priority write-backs become visible mid-batch. Sample bundles set both
delays to zero, keep a large ring, and use batch size one, so those interactions stay green there.

The recordings are synthetic fixtures built to force truncation bootstrap choice, wrap-time
residency, lagged-versus-current weight mass, and multi-draw write-back isolation to interact
across modules. An RL infrastructure engineer would perform this reconstruction when validating
reproducibility of an asynchronous learner under publication lag and priority aging.

Solving requires tracing cut observations through V-trace, the inclusive residency predicate under
ring wrap, and separating draw-vector mass from deferred write-back as one state machine. Local
patches that only restore visibility lag or frozen-epoch scoring no longer reach the graded ledger.
"""
solution_explanation = """
Keep visibility lag, carried insert-step epochs, and ledger-length importance weights. Bootstrap
truncated segments from the observation recorded at the truncation cut. Keep the inclusive ring
residency predicate. Compute importance weights from the captured pre-draw ledger mass even when
draws used a lagged vector, and defer priority write-backs until after the whole batch resolves.
Install the fixed ingest, buffer, segments, and learner modules, then run the CLI.
"""
verification_explanation = """
The verifier recomputes ledgers from sealed inputs with a reference package that follows the
contract. Counts match exactly and floating aggregates match at six decimals. The oracle copies
the four fixed modules and runs the CLI. A nop agent keeps the wrong truncation bootstrap, a
strict residency bound, sampler-mass importance weights, and eager in-batch write-back, so graded
bundles diverge while samples stay green.
"""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
